<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальный радар знакомств — Найти пару</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Яркий динамичный фон с акцентом на ночной город и неоновое свечение */
            background: linear-gradient(180deg, #05070b 0%, #101726 100%),
                        url('https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Обёртка в стиле карточки смартфона / дейтинг-приложения */
        .app-card {
            width: 100%;
            max-width: 380px;
            background: rgba(13, 18, 28, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 0, 85, 0.1);
            position: relative;
        }

        /* Верхняя мини-плашка гео-радара */
        .radar-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .radar-title {
            font-size: 13px;
            font-weight: 600;
            color: #8F9CAE;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .geo-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #FF0055;
            font-weight: 700;
        }
        .geo-dot span {
            width: 6px;
            height: 6px;
            background: #FF0055;
            border-radius: 50%;
            box-shadow: 0 0 8px #FF0055;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Экран профиля (Основной слайдер) */
        .profile-stage {
            position: relative;
            width: 100%;
            height: 420px;
            background-size: cover;
            background-position: center;
            transition: background-image 0.3s ease;
        }

        /* Градиент затемнения для читаемости имени поверх фото */
        .profile-stage::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 150px;
            background: linear-gradient(to top, rgba(13, 18, 28, 1), transparent);
        }

        .profile-info-overlay {
            position: absolute;
            bottom: 16px;
            left: 20px;
            right: 20px;
            z-index: 2;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        .profile-sub {
            font-size: 13px;
            color: #00E5FF;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Кнопки действий (Свайпы / Симпатии) */
        .action-buttons {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 24px;
            background: rgba(13, 18, 28, 0.9);
        }

        .btn-action {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .btn-action:hover {
            transform: scale(1.08);
        }

        .btn-reject {
            background: #1a2332;
            border: 1px solid rgba(255,255,255,0.1);
            color: #8F9CAE;
        }

        .btn-like {
            background: linear-gradient(135deg, #FF0055, #FF5588);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        /* Экран финального мэтча (скрыт по умолчанию) */
        .match-screen {
            display: none;
            padding: 40px 24px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .match-title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FFF, #00E5FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .match-desc {
            font-size: 14px;
            color: #8F9CAE;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .cta-button {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00E5FF, #0077FF);
            color: #05070b;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
            transition: all 0.2s;
        }

        .cta-button:hover {
            box-shadow: 0 0 45px rgba(0, 229, 255, 0.7);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="app-card">
        
        <!-- Радар плашка -->
        <div class="radar-header" id="radarHeader">
            <span class="radar-title">Радар • Рядом с вами</span>
            <div class="geo-dot"><span></span> Онлайн</div>
        </div>

        <!-- Карточка профиля с интерактивным свайпом -->
        <div class="profile-stage" id="profileStage" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80');">
            <div class="profile-info-overlay">
                <div class="profile-name" id="profileName">Кристина, 22</div>
                <div class="profile-sub" id="profileDist">📍 в 1.4 км от вас • Ищет встречу</div>
            </div>
        </div>

        <!-- Кнопки управления (Интерактив) -->
        <div class="action-buttons" id="actionButtons">
            <button class="btn-action btn-reject" onclick="changeProfile()">✕</button>
            <button class="btn-action btn-like" onclick="triggerMatch()">♥</button>
        </div>

        <!-- Экран успешного совпадения (Появляется при клике на сердечко) -->
        <div class="match-screen" id="matchScreen">
            <div class="match-title">Взаимная симпатия! 🔥</div>
            <div class="match-desc">Кристина и еще 18 пользователей из вашего района хотят отправить вам сообщение и фото.</div>
            <!-- Сюда вставляется ваша партнерская ссылка -->
            <a href="YOUR_OFFER_LINK_HERE" class="cta-button">НАЧАТЬ ОБЩЕНИЕ (18+)</a>
        </div>

    </div>

    <footer>
        18+ • Безопасное соединение шифруется протоколом SSL
    </footer>

    <script>
        // Массив моделей для симуляции свайпов
        const profiles = [
            { name: "Анна, 24", dist: "в 800 м от вас", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80" },
            { name: "Елена, 21", dist: "в 2.1 км от вас", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80" }
        ];
        let index = 0;

        function changeProfile() {
            if (index < profiles.length) {
                let stage = document.getElementById('profileStage');
                stage.style.opacity = "0.4";
                setTimeout(() => {
                    stage.style.backgroundImage = `url('${profiles[index].img}')`;
                    document.getElementById('profileName').innerText = profiles[index].name;
                    document.getElementById('profileDist').innerText = `📍 ${profiles[index].dist} • Ищет встречу`;
                    stage.style.opacity = "1";
                    index++;
                }, 200);
            } else {
                // Если пролистал все — автоматически триггерим мэтч
                triggerMatch();
            }
        }

        function triggerMatch() {
            document.getElementById('profileStage').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';
            document.getElementById('radarHeader').style.display = 'none';
            document.getElementById('matchScreen').style.display = 'block';
        }
    </script>
</body>
</html>
